name: Security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly: full scan suite
    - cron: "17 13 * * *"  # daily: production Headers live probe only
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ (github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1') }}
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan site and workflow code
        run: semgrep scan --config auto --error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks itself, digest-pinned (v8.30.1), not gitleaks-action: the action
      # asks the GitHub API whether the owner is an organization before it scans,
      # and on any API error it demands a commercial license and fails. One
      # timeout held this check red from 2026-11-16 to 2026-11-23. The full
      # history is scanned; exit 1 on any finding.
      - uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --verbose --exit-code 1 .

      # A step, not a job: the gate rides an already-required check, so no
      # ruleset change. Pinned by SHA like every other action — the gate that
      # enforces pinning is itself pinned; Dependabot carries version bumps.
      - uses: windwardline/windwardline/actions/verify-action-pins@7e6d53cdf02944bf21cab73e13104386e9a4735a # v1.1.1

  headers-live:
    name: Headers live
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assert the seven security headers on production
        uses: windwardline/windwardline/actions/verify-live-headers@7e6d53cdf02944bf21cab73e13104386e9a4735a # v1.1.1
        with:
          url: https://media.windwardline.com
